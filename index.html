me": "BCA Sekuritas", "type": "Lokal", "lots": 400178, "val": 155377523000, "avg": 4290.036046717884}, "gap_top": -12.8}}], "exa": {"MU": {"query": {"thesis": "Micron Technology, Inc. MU earnings growth outlook 2026 analyst view", "risk": "Micron Technology, Inc. MU risk competition margin pressure 2026"}, "results": [{"kind": "thesis", "title": "MU barely budged on earnings. Wall Street thinks gains will come", "url": "https://www.cnbc.com/2026/10/01/mu-barely-budged-on-earnings-wall-street-thinks-gains-will-come.html", "date": "2026-10-01T10:53:46.000Z", "highlight": "Micron Technology posted strong quarterly results on Wednesday, giving analysts plenty of reasons to be bullish on the stock. The memory-chip company posted adjusted earnings of $33.42 per share for the fourth fiscal quarter, exceeding the $31.61 expected by analysts polled by LSEG. It also clocked $54.23 billion in revenue, topping the Street's consensus of $51.07 billion. That figure came in nea"}, {"kind": "thesis", "title": "Behind the Earnings Call: Micron Technology Inc. Q4 2026 | S&P Global", "url": "https://www.spglobal.com/market-intelligence/en/news-insights/research/2026/10/behind-the-earnings-call-micron-technology-inc-q4-2026", "date": "2026-10-26T17:47:00.000Z", "highlight": "## Overview\n\nMicron closed fiscal 2026 on a high. Record revenue, gross margin and EPS in Q4 all came in above the top of its guidance. CEO Sanjay Mehrotra called the year \"outstanding,\" with revenue 3.5x last year's record, data center revenue up fourfold, and DRAM revenue passing $100 billion. \n\n## Financial performance and consensus\n\nPowered by Visible Alpha Estimates\n\n- Q4 revenue was a record"}, {"kind": "thesis", "title": "", "url": "https://www.tipranks.com/stocks/mu/earnings", "date": null, "highlight": "## Earnings Data\n\nAnalyze Earnings\n\nReport Date\n\nDec 23, 2026\n\nAfter Close (Confirmed)\n\nPeriod Ending\n\n2027 (Q1)\n\nConsensus EPS Forecast\n\n38.23\n\nLast Year’s EPS\n\n4.78\n\nSame Q i tapi fondasi pasokannya bukan milik sendiri.", "SMCI": "Kenapa masuk: guidance revenue FY26 minimal $36 miliar, dan pertumbuhan historis paling agresif di daftar ini (CAGR 76%). Kenapa bisa gagal: FCF negatif, dilusi saham di atas 5% per tahun, margin tertekan karena terjepit antara pemasok (Nvidia) dan pembeli hyperscaler, ditambah probe ekspor yang membuat BofA memasang Underperform dengan target $24. Ini contoh sempurna 'growth tanpa kualitas' — skor pertumbuhannya 100, skor kualitasnya 27.", "MRVL": "Kenapa masuk: Q4 FY26 revenue $2,219 miliar (+22% YoY) dan Investor Day menaikkan target jangka panjang, cukup untuk memicu upgrade analis. Kenapa bisa gagal: bisnis custom silicon mendilusi gross margin sekitar 0,25 poin tiap kuartal, dan revenue sangat bergantung pada beberapa pelanggan besar. Layak dipantau, bukan dibeli buta di PER 82.", "NCKL.JK": "Kenapa masuk: laba bersih 1Q26 naik 63,7% jadi Rp2,7 triliun, dengan PER 5,1 dan P/FCF 5,9 — paling murah di daftar ini untuk pertumbuhan 45,8% CAGR. Analis memasang BUY dengan target Rp1.300-1.800. Kenapa bisa gagal: kenaikan royalti dan tekanan biaya sudah memaksa sejumlah sekuritas memangkas target dari Rp1.800 ke Rp1.300, dan harga nikel adalah variabel yang tidak dikendalikan perusahaan. Skor momentum 0 alias harga sedang di bawah MA200 — di sinilah risiko 'murah tapi turun terus'.", "TAPG.JK": "Kenapa masuk: 2Q26 disebut 'perfect combo of production and pricing', ROE 33%, dan valuasi PER 10,3 dengan P/FCF 13,6. Proyeksi CPO ASP ~Rp15.300/kg (+8% YoY) menopang laba. Kenapa bisa gagal: kebijakan ekspor satu pintu lewat Danantara (DSI) adalah risiko regulasi yang belum ada biayanya hari ini tapi bisa muncul kapan saja, dan Q1 2026 sudah menunjukkan perlambatan. Ini nama yang bergantung pada harga CPO, bukan pada eksekusi unik.", "CMRY.JK": "Kenapa masuk: penjualan tumbuh 15,2% CAGR FY25-27F (vs rata-rata staples Indonesia 5,4%), laba bersih 1H26 Rp1,2 triliun (+17,9% YoY), ROE 30%, dan neraca bersih. Kenapa bisa function kpis(){
  const r=D.rows, us=r.filter(x=>x.market==='US').length;
  const clean=r.filter(x=>!x.flags.length).length;
  const src=Object.values(D.exa).reduce((a,v)=>a+v.results.length,0);
  document.getElementById('kpis').innerHTML=[['Emiten',r.length],['US / IDX',us+' / '+(r.length-us)],
    ['Tanpa red flag',clean],['Sumber Exa',src]].map(([k,v])=>`<div class="kpi">${k}<b>${v}</b></div>`).join('');
}
function rowsFor(){
  let r=D.rows.filter(x=>x.sym.toLowerCase().includes(qv())||(x.name||'').toLowerCase().includes(qv()));
  const m=document.getElementById('mkt').value; if(m) r=r.filter(x=>x.market===m);
  if(document.getElementById('clean').checked) r=r.filter(x=>!x.flags.length);
  if(tab==='bandar') r=r.filter(x=>x.market==='IDX');
  return r;
}
function sortRows(r){
  const val=x=>({total:x.scores.total,fnet:x.sb.foreign_net,gap:x.sb.gap_top,pe:x.metrics.per,
    roe:x.metrics.roe,mcap:x.mcap}[sortKey]);
  if(sortKey==='pe') return r.sort((a,b)=>{const A=val(a),B=val(b);return (A==null?1e18:A)-(B==null?1e18:B)});
  return r.sort((a,b)=>{const A=val(a),B=val(b);return (B==null?-1e18:B)-(A==null?-1e18:A)});
}

        <td>${g(b.per)}</td>
        <td class="mut" style="font-size:11px">${(b.span||'').replace('-12-31','').replace('→','–')}</td>
        <td class="mut">${s.total}</td></tr>`;
    }
    if(tab==='bandar'){
      const ta=sb.top_acc, gap=sb.gap_top, gc=gap==null?'mut':(gap>=0?'pos':'neg');
      return `<tr onclick="openD('${x.sym}')">
        <td class="mut">${i+1}</td>
        <td><div class="tk">${x.bare}</div><div class="nm">${(x.name||'').slice(0,26)}</div></td>
        <td><span class="badge IDX">IDX</span></td>
        <td class="${sb.foreign_net>0?'pos':sb.foreign_net<0?'neg':'mut'}">${fmt.rp(sb.foreign_net)}</td>
        <td>${ta?`<b>${ta.code}</b> <span class="mut">${(ta.name||'').split(' ')[0]}</span>`:'–'}</td>
        <td>${ta?fmt.n(ta.lots/1000,0)+' rb':'–'}</td>
        <td class="${gc}">${gap==null?'–':fmt.pct(gap)}</td>
        <td class="${sb.net_lots>0?'pos':sb.net_lots<0?'neg':'mut'}">${fmt.n(sb.net_lots/1000,0)} rb</td>
        <td>${fmt.n(sb.pe)}</td><td>${fmt.n(sb.pbv,2)}</td><td>${fmt.n(sb.roe)}%</td><td>${fmt.n(sb.div)}%</td>
        <td class="fl">${x.flags.length?x.flags.length+' flag':''}</td></tr>`;
    }
    return `<tr onclick="openD('${x.sym}')">
      <td class="mut">${i+1}</td>
      <td><div class="tk">${x.bare}</div><div class="nm">${(x.name||'').slice(0,30)}</div></td>
      <td><span class="badge ${x.market}">${x.market}</span></td>
      <td><span class="sc tx ${cc(s.total)}">${s.total}</span><div class="scbar"><i class="${cc(s.total)}" style="width:${s.total}%"></i></div></td>
      <td>${s.qual}</td><td>${s.grow}</td><td>${s.bal}</td><td>${s.val}</td><td>${s.trend}</td>
      <td>${fmt.n(m.per)}</td><td>${fmt.n(m.roe)}%</td><td>${fmt.n(m.fcfmargin)}%</td>
      <td class="${m.revcagr>0?'pos':'neg'}">${fmt.pct(m.revcagr)}</td>
      <td class="fl">${x.flags.length?x.flags.length+' flag':''}</td></tr>`;
  }).join('');
}
function openD(sym){
  const x=D.rows.find(r=>r.sym===sym); if(!x) return;
  const s=x.scores,m=x.metrics,sb=x.sb, ex=D.exa[sym], v=D.verdicts[sym];
  const cells=[['Harga',fmt.n(x.price,0)],['Mkt cap',fmt.rp(x.mcap)],['PER',fmt.n(m.per)],['ROE',fmt.n(m.roe)+'%'],
   ['Rev CAGR',fmt.pct(m.revcagr)],['Net margin',fmt.n(m.netmargin)+'%'],['FCF margin',fmt.n(m.fcfmargin)+'%'],
   ['D/E',fmt.n(m.de)],['EV/EBIT',fmt.n(m.evebit)],['vs MA200',fmt.pct(m.ma200)],['6 bln',fmt.pct(m.ret6m)],
   ['Dari high',fmt.pct(m.fromhigh)]];
  let h=`<h2>${x.bare}</h2><div class="sub">${x.name||''} · ${x.market}${x.sector?' · '+x.sector:''}</div>
  <div style="margin-top:12px"><span class="tx ${cc(s.total)}" style="font-size:26px;font-weight:700">${s.total}</span>
  <span class="mut">/100</span></div>
  <div class="grid">${cells.map(([k,v])=>`<div class="cell"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`;
  h+=`<h3>Skor per dimensi</h3><div class="grid">${[['Kualitas',s.qual],['Growth',s.grow],['Neraca',s.bal],['Valuasi',s.val],['Tren',s.trend]]
    .map(([k,v])=>`<div class="cell"><div class="k">${k}</div><div class="v tx ${cc(v)}">${v}</div><div class="scbar"><i class="${cc(v)}" style="width:${v}%"></i></div></div>`).join('')}</div>`;
  if(v) h+=`<h3>Penilaian</h3><div class="verdict">${v}</div>`;
  if(x.flags.length) h+=`<h3>Red flag</h3><div>${x.flags.map(f=>`<span class="flag">${f}</span>`).join('')}</div>`;
  if(sb.pe||sb.pbv||(sb.acc||[]).length){
    h+=`<h3>Stockbit ${sb.from?`(${sb.from} → ${sb.to})`:''}</h3><div class="grid">
      <div class="cell"><div class="k">PER TTM</div><div class="v">${fmt.n(sb.pe)}</div></div>
      <div class="cell"><div class="k">PER fwd</div><div class="v">${fmt.n(sb.pe_fwd)}</div></div>
      <div class="cell"><div class="k">PBV</div><div class="v">${fmt.n(sb.pbv,2)}</div></div>
      <div class="cell"><div class="k">ROE SB</div><div class="v">${fmt.n(sb.roe)}%</div></div>
      <div class="cell"><div class="k">Div yield</div><div class="v">${fmt.n(sb.div)}%</div></div>
      <div class="cell"><div class="k">Asing net</div><div class="v ${sb.foreign_net>0?'pos':'neg'}">${fmt.rp(sb.foreign_net)}</div></div></div>`;
    if((sb.acc||[]).length){
      h+='<div class="sub" style="margin:6px 0 2px">Akumulator teratas</div>';
      h+=sb.acc.map(a=>`<div class="broker"><b>${a.code}</b><span class="nm2">${a.name||''} · ${a.type}</span>
        <span class="pos">+${fmt.n(a.lots/1000,0)} rb</span><span class="mut">avg ${fmt.n(a.avg,0)}</span></div>`).join('');
    }
    if((sb.dist||[]).length){
      h+='<div class="sub" style="margin:10px 0 2px">Distributor teratas</div>';
      h+=sb.dist.map(a=>`<div class="broker"><b>${a.code}</b><span class="nm2">${a.name||''} · ${a.type}</span>
        <span class="neg">${fmt.n(a.lots/1000,0)} rb</span><span class="mut">avg ${fmt.n(a.avg,0)}</span></div>`).join('');
    }
  }
  if(ex){
    h+=`<h3>Deep dive Exa — ${ex.results.length} sumber</h3>`;
    h+=ex.results.map(r=>`<div class="src"><span class="kind ${r.kind}">${r.kind}</span>
      <a href="${r.url}" target="_blank" rel="noopener">${(r.title||r.url).slice(0,110)}</a>
      ${r.highlight?`<p>${r.highlight.slice(0,420)}</p>`:''}</div>`).join('');
  }
  document.getElementById('dbody').innerHTML=h;
  document.getElementById('drawer').classList.add('open');
}
function closeD(){document.getElementById('drawer').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); tab=b.dataset.tab;
  document.getElementById('srt').value = tab==='bandar'?'fnet':'total';
  document.getElementById('srt').disabled = (tab==='buff');
  sortKey=document.getElementById('srt').value; render();
});
['q','mkt','srt','clean'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
  if(id==='srt') sortKey=document.getElementById('srt').value; render();}));
document.getElementById('foot').textContent =
 `Dibuat ${D.generated} · fundamental: Yahoo/SEC/stockanalysis · deep dive: Exa · bandarmology: Stockbit ${D.sb_window||'—'} · bukan rekomendasi beli`;
kpis(); render();
</script></body></html>
